[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromodoro"
version = "0.1.0"
description = "Desktop Pomodoro work tracker that turns focused time into visible project progress."
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2",
    "darkdetect>=0.8",
    "Pillow>=10.0",
    "pystray>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "pyinstaller>=6.22",
]

[project.gui-scripts]
chromodoro = "ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["domain", "services", "storage", "ui", "utils"]
py-modules = ["config"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
